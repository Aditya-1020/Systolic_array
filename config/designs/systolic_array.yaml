design:
  name: systolic_array
  top: sys_top

rtl:
  root: rtl
  filelist: files.f

constraints:
  default: "constraints/constraints_{platform}.sdc"
  io: "constraints/io_constraints_{platform}.tcl"

orfs:
  design_config: "design-configs/{platform}.mk"
  flow_variant: base
  openroad_hierarchical: false

macro_placement: "design-configs/placements/lshape_right.tcl"

macros:
  - instance: u_wbuf_mem.g_64x64.u_mem
    model: sram_sp_64x64
  - instance: u_abuf_mem.g_64x64.u_mem
    model: sram_sp_64x64
  - instance: u_rbuf_mem.g_256x64.u_mem
    model: sram_sp_64x256

extensions:
  tcl: []
