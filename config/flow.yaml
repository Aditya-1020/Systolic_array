defaults:
  design: systolic_array
  platform: sky130hd
  run_tag: base
  flow_variant: base

paths:
  work_home: "build/runs/{platform}/{design}/{run_tag}"
  metrics_db: "build/analysis/metrics.db"
  placements_static: "design-configs/placements"
  rtl_dir: "{design_rtl_root}"
  constraints_dir: "constraints"
  fakeram_dir: "fakeram/{fakeram_tech}"
  fakeram_config: "fakeram/{fakeram_tech}/{fakeram_tech}_fakeram.cfg"

# ORFS currently uses these conventional output names. Override here if the
# installed ORFS revision uses a different naming scheme.
artifacts:
  mapped_netlist: "1_2_yosys.v"
  synthesis_odb: "1_synth.odb"
  floorplan_odb: "2_floorplan.odb"
  placement_odb: "3_place.odb"
  cts_odb: "4_cts.odb"
  route_odb: "5_route.odb"
  final_odb: "6_final.odb"
  final_gds: "6_final.gds"

extensions:
  tcl: []
