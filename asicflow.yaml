project:
  name: systolic_array
  top: sys_top
  platform: sky130hd

paths:
  rtl: rtl
  constraints: constraints
  macros: fakeram/sky130
  build: build

rtl:
  filelist: rtl/files.f
  include_dirs: []
  defines: []

physical:
  design_config: design-configs/sky130hd.mk
  run_tag: base
  flow_variant: base
  placement: rtlmp

timing:
  liberty: auto
  clock_period: 5.0
  jobs: 6
  default_corners:
    - tt_025C_1v80
    - tt_100C_1v80
    - ss_100C_1v60
    - ss_100C_1v40
    - ff_n40C_1v95
    - ff_100C_1v95

macros:
  - instance: u_wbuf_mem.g_64x64.u_mem
    model: sram_sp_64x64
  - instance: u_abuf_mem.g_64x64.u_mem
    model: sram_sp_64x64
  - instance: u_rbuf_mem.g_256x64.u_mem
    model: sram_sp_64x256

extensions:
  tcl: []
